name: Build artifacts

# Rebuilds the installable .skill bundle and the cheat-sheet PDF whenever
# their sources change, and commits them back to main. Exists because the
# maintainer's API-based workflow cannot push binary files.
#
# Save this file as .github/workflows/build.yml in the pherkad repo and
# commit it from a real terminal (the API token lacks the workflow scope).

#
# Gated on the Test workflow: it runs only after Test finishes green on main,
# so a red suite never publishes a bundle (0.5.33 shipped with Test failing).
# Artifacts are committed only when they actually change.

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .skill bundle
        run: bash build.sh

      - name: Build cheat sheet PDF
        run: |
          pip install --quiet weasyprint
          python -c "import weasyprint; weasyprint.HTML('docs/CHEATSHEET.html').write_pdf('docs/CHEATSHEET.pdf')"

      - name: Lint the self-lint-scoped docs
        # Lint the two documents covered by the repository's public self-lint
        # claim. CHANGELOG.md and references/ai_tells.md quote configured
        # patterns, so they are excluded from this mechanical check.
        run: |
          python3 skills/pherkad/tools/voicelint.py README.md docs/CHEATSHEET.md

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pherkad.skill docs/CHEATSHEET.pdf
          git diff --cached --quiet || (git commit -m "Rebuild pherkad.skill and cheat sheet PDF [skip ci]" && git push)
