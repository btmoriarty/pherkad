name: Build artifacts

# Rebuilds the installable .skill bundle and the cheat-sheet PDF and commits
# them back to main when they change. Exists because the maintainer's
# API-based workflow cannot push binary files.
#
# Gated on the Test workflow: it runs only after Test finishes green on main,
# so a red suite never publishes a bundle (0.5.33 shipped with Test failing).
#
# Two jobs, so third-party code never holds a token that can push (I013):
#   build    read-only token; installs the one PyPI dependency (the PDF
#            renderer) from hash-pinned .github/ci-requirements.txt, builds,
#            lints, and uploads the two files as a workflow artifact.
#   publish  write token; runs no installed package, only git: downloads the
#            two files, and commits and pushes them if they changed.
# Every action is pinned to a commit SHA, and checkout keeps no credentials.

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Build .skill bundle
        run: bash build.sh

      - name: Build cheat sheet PDF
        run: |
          python -m pip install --quiet --require-hashes --no-deps -r .github/ci-requirements.txt
          python -c "import weasyprint; weasyprint.HTML('docs/CHEATSHEET.html').write_pdf('docs/CHEATSHEET.pdf')"

      - name: Lint the self-lint-scoped docs
        # Lint the documents covered by the repository's public self-lint
        # claim. CHANGELOG.md and references/ai_tells.md quote configured
        # patterns, so they are excluded from this mechanical check. The HTML is
        # the source of the published PDF, so it is linted too (I017).
        run: python3 skills/pherkad/tools/voicelint.py README.md docs/CHEATSHEET.md docs/CHEATSHEET.html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: artifacts
          path: |
            pherkad.skill
            docs/CHEATSHEET.pdf
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: artifacts

      - name: Commit and push if changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pherkad.skill docs/CHEATSHEET.pdf
          if git diff --cached --quiet; then echo "artifacts unchanged"; exit 0; fi
          git commit -m "Rebuild pherkad.skill and cheat sheet PDF [skip ci]"
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
